<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button id="testButton">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing connection to backend...';
            
            try {
                const response = await fetch('http://127.0.0.1:5100/');
                const data = await response.text();
                resultDiv.innerHTML = `Connection successful! Response: ${data}`;
            } catch (error) {
                resultDiv.innerHTML = `Connection failed: ${error.message}`;
            }
        });
    </script>
</body>
</html>
